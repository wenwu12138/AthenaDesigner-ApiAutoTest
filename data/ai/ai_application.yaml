template_asset_ai_create_001:
  host: ${{athena_designer_host()}}
  url: /athena-designer/template
  method: POST
  detail: 创建最小服务编排模板并缓存 objectId 与 id
  headers:
    digi-middleware-auth-user: $cache{token}
    token: $cache{token}
    locale: zh_CN
    content-type: application/json
  requestType: JSON
  is_run: true
  data:
    name: AI服务编排模板${{get_time()}}
    lang:
      name:
        zh_CN: AI服务编排模板${{get_time()}}
        zh_TW: AI服務編排模板${{get_time()}}
        en_US: AI Template ${{get_time()}}
    links: []
    tasks:
    - id: Task${{random_id()}}
      name: node-js-${{random_id()}}
      description: AI服务编排模板闭环
      type: JS
      inputParameters:
        script: 'return {"msg":"ok"}'
      graphData:
        position:
          x: -45.5
          y: -53.5
        size:
          width: 68
          height: 40
        attrs:
          body:
            rx: 6
            ry: 6
            stroke: '#2113D9'
            fill: '#DAE8FF'
            strokeWidth: 1
            magnet: false
          label:
            text: 脚本
            fontSize: 12
            textWrap:
              width: 68
              ellipsis: true
        visible: true
        shape: rect
        id: node-${{random_id()}}
        nodeType: js
        markup:
        - tagName: rect
          selector: body
        - tagName: text
          selector: label
        ports:
          groups:
            top:
              position: top
              attrs:
                circle:
                  r: 4
                  magnet: true
                  stroke: '#5F95FF'
                  strokeWidth: 1
                  fill: '#fff'
                  style:
                    visibility: hidden
          items:
          - group: top
            id: port-${{random_id()}}
        zIndex: 1
    applicationCode: ${{app2_code()}}
    addSourceType: auto_perspective
  dependence_case: false
  dependence_case_data: null
  assert:
    code:
      jsonpath: $.code
      type: ==
      value: 0
      AssertType: null
    template_asset_object_id_not_empty:
      jsonpath: $.data.objectId
      type: not_eq
      value: ''
      AssertType: null
  current_request_set_cache:
  - type: response
    jsonpath: $.data.objectId
    name: template_asset_object_id
  - type: response
    jsonpath: $.data.id
    name: template_asset_id

